[project]
name = "planteye"
version = "1.0.0"
requires-python = ">=3.11"
description = "Plant health monitoring network with Flask"
dependencies = [
    "flask",
    "sqlalchemy",
    "flask-sqlalchemy",
    "requests",
    "openai",
    "openai-agents",
    "psycopg2-binary",
    "flask-migrate",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-flask",
    "coverage"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["planteye"]
